apply plugin: 'com.android.application'
android {
    namespace 'com.yolo.dyfusion'
    compileSdk 34
    defaultConfig { applicationId 'com.yolo.dyfusion'; minSdk 26; targetSdk 34; versionCode 8; versionName '0.3.3-preview' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { compileOnly files('libs/xposed-api-82.jar') }

